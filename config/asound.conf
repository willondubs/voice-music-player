# ALSA Configuration for Voice Music Player
# This configuration allows multiple applications to share audio devices
# Copy this to /etc/asound.conf or ~/.asoundrc

# Define the Sony PS3 Eye microphone (card 3, device 0)
pcm.ps3eye {
    type hw
    card 3
    device 0
    channels 4
    rate 16000
}

# Create a dsnoop device for the microphone (allows sharing)
pcm.ps3eye_dsnoop {
    type dsnoop
    ipc_key 5678293
    ipc_perm 0666
    slave {
        pcm "hw:3,0"
        channels 4
        rate 16000
        format S16_LE
    }
}

# Define the RPi headphone output (card 0, device 0)
pcm.rpi_headphone {
    type hw
    card 0
    device 0
}

# Create a dmix device for the headphone output (allows sharing)
pcm.rpi_dmix {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
        period_time 0
        period_size 1024
        buffer_size 4096
    }
}

# Plug wrapper for automatic conversion
pcm.rpi_out {
    type plug
    slave.pcm "rpi_dmix"
}

pcm.mic_in {
    type plug
    slave.pcm "ps3eye_dsnoop"
}

# Set defaults
pcm.!default {
    type asym
    playback.pcm "rpi_out"
    capture.pcm "mic_in"
}

ctl.!default {
    type hw
    card 0
}
